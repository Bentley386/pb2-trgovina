{% load trgovina_app_extras %}
{% if user.is_authenticated and user != oglas.lastnik %}
<form action="{% url 'trgovina_app:oglas_priljubljen' %}" method="POST" style="display:inline">
    {% csrf_token %}
    <input type="hidden" name="oglas_id" value="{{ oglas.id }}">
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if user|je_priljubljen:oglas %}
    <button class="button is-small is-danger" title="Odstrani iz priljubljenih">Ni mi vše&#269;</button>
    {% else %}
    <button class="button is-small is-light" title="Dodaj med priljubljene">Vše&#269; mi je</button>
    {% endif %}
</form>
{% endif %}
